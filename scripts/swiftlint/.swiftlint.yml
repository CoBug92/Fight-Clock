only_rules:
  - colon
  - comma
  - contains_over_filter_count
  - control_statement
  - duplicate_imports
  - empty_count
  - file_length
  - first_where
  - flatmap_over_map_reduce
  - force_cast
  - force_try
  - force_unwrapping
  - indentation_width
  - line_length
  - opening_brace
  - operator_usage_whitespace
  - implicit_optional_initialization
  - return_arrow_whitespace
  - statement_position
  - syntactic_sugar
  - trailing_newline
  - trailing_whitespace
  - unused_import
  - vertical_whitespace
  - void_return

excluded:
  - .DerivedData
  - BoxingTimer.xcodeproj

force_cast: error
force_try: error
force_unwrapping: error
unused_import: error

indentation_width:
  indentation_width: 4

line_length:
  warning: 140
  error: 150
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 400
  error: 500

trailing_whitespace:
  ignores_empty_lines: false
  ignores_comments: false
