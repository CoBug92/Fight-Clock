options:
  bundleIdPrefix: ru.kostyuchenko
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 6.0
    TARGETED_DEVICE_FAMILY: 1
    SUPPORTS_MACCATALYST: false
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.2
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${TEAM_ID}

fileGroups:
  - ../../BoxingTimer/Resources/Assets
  - ../../BoxingTimer/Resources/Audio
  - ../../BoxingTimer/Resources/Configuration
  - ../../BoxingTimer/Resources/Generated
  - ../../BoxingTimer/Resources/Localization

targets:
  BoxingTimer:
    type: application
    platform: iOS
    sources:
      - ../../BoxingTimer/App
      - ../../BoxingTimer/Core
      - ../../BoxingTimer/Flows
      - ../../BoxingTimer/Infrastructure
      - ../../BoxingTimer/Model
      - path: ../../BoxingTimer/Resources
        excludes:
          - Generated/Localizations.swift
      - ../../BoxingTimer/Resources/Generated/Localizations.swift
    dependencies:
      - target: BoxingTimerLiveActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.kostyuchenko.fightclock
        PRODUCT_NAME: FightClock
        PRODUCT_MODULE_NAME: BoxingTimer
        TARGETED_DEVICE_FAMILY: 1
        INFOPLIST_FILE: BoxingTimer/Resources/Configuration/Info.plist
        CODE_SIGN_ENTITLEMENTS: BoxingTimer/Resources/Configuration/BoxingTimer.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - BoxingTimerUnitTests

  BoxingTimerLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - ../../BoxingTimer/LiveActivity
      - path: ../../BoxingTimer/Model/Domain
      - path: ../../BoxingTimer/Core/Session
      - path: ../../BoxingTimer/Infrastructure/Persistence/SharedDefaults.swift
      - path: ../../BoxingTimer/Infrastructure/Persistence/SessionRepository.swift
      - path: ../../BoxingTimer/Infrastructure/Persistence/UserDefaultsSessionRepository.swift
      - path: ../../BoxingTimer/Infrastructure/Notifications/NotificationScheduler.swift
      - path: ../../BoxingTimer/Infrastructure/Notifications/NotificationScheduling.swift
      - path: ../../BoxingTimer/Infrastructure/Notifications/NotificationPermission.swift
      - path: ../../BoxingTimer/Resources/Localization
      - path: ../../BoxingTimer/Resources/Audio
      - path: ../../BoxingTimer/Resources/Generated/Localizations.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.kostyuchenko.fightclock.liveactivity
        PRODUCT_NAME: FightClockLiveActivity
        PRODUCT_MODULE_NAME: BoxingTimerLiveActivity
        TARGETED_DEVICE_FAMILY: 1
        INFOPLIST_FILE: BoxingTimer/LiveActivity/Info.plist
        CODE_SIGN_ENTITLEMENTS: BoxingTimer/LiveActivity/BoxingTimerLiveActivity.entitlements
        SKIP_INSTALL: true

  BoxingTimerUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ../../BoxingTimer/UnitTests
    dependencies:
      - target: BoxingTimer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.kostyuchenko.fightclock.unittests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/FightClock.app/FightClock
        BUNDLE_LOADER: $(TEST_HOST)
