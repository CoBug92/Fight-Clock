options:
  bundleIdPrefix: ru.kostyuchenko
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 6.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.4
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ${TEAM_ID}
    ENABLE_USER_SCRIPT_SANDBOXING: true
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: true

fileGroups:
  - ../../Main/Resources/Assets
  - ../../Main/Resources/Audio
  - ../../Main/Resources/Configuration
  - ../../Main/Resources/Generated
  - ../../Main/Resources/Localization

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 12.17.0

targets:
  Main:
    type: application
    platform: iOS
    sources:
      - ../../Main/App
      - ../../Main/Core
      - ../../Main/Flows
      - ../../Main/Infrastructure
      - ../../LiveActivity/Infrastructure/Client
      - ../../Main/Model
      - path: ../../LiveActivity/Model/Shared/BoxingTimerActivityAttributes.swift
      - path: ../../Main/Resources
        excludes:
          - Generated/Localizations.swift
      - ../../Main/Resources/Generated/Localizations.swift
    dependencies:
      - target: LiveActivity
        embed: true
        platformFilter: iOS
      - package: Firebase
        product: FirebaseAnalyticsCore
      - package: Firebase
        product: FirebaseCrashlytics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.kostyuchenko.fightclock
        PRODUCT_NAME: FightClock
        PRODUCT_MODULE_NAME: Main
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: true
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: false
        ENABLE_APP_SANDBOX[sdk=macosx*]: true
        ENABLE_OUTGOING_NETWORK_CONNECTIONS[sdk=macosx*]: true
        ENABLE_USER_SCRIPT_SANDBOXING: false
        INFOPLIST_FILE: Main/Resources/Configuration/Info.plist
        CODE_SIGN_ENTITLEMENTS: Main/Resources/Configuration/BoxingTimer.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        OTHER_LDFLAGS: -ObjC
    postBuildScripts:
      - name: Upload Crashlytics Symbols
        script: |
          "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
        inputFiles:
          - ${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run
          - ${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - ${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist
          - ${TARGET_BUILD_DIR}/${EXECUTABLE_PATH}
        basedOnDependencyAnalysis: false
    scheme:
      testTargets:
        - MainUnitTests

  LiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - ../../LiveActivity/App
      - ../../LiveActivity/Flows
      - ../../LiveActivity/Infrastructure
      - ../../LiveActivity/Model
      - ../../LiveActivity/Resources
      - path: ../../Main/Core/Presentation/Margin.swift
      - path: ../../Main/Core/Presentation/SFSymbol.swift
      - path: ../../Main/Core/Presentation/SpokenDuration.swift
      - path: ../../Main/Core/Presentation/TechnicalString.swift
      - path: ../../Main/Infrastructure/System/AppSettingsOpening.swift
      - path: ../../Main/Model/Domain
      - path: ../../Main/Core/Session
      - path: ../../Main/Infrastructure/Persistence/SharedDefaults.swift
      - path: ../../Main/Infrastructure/Persistence/Session/SessionRepository.swift
      - path: ../../Main/Infrastructure/Persistence/Session/UserDefaultsSessionRepository.swift
      - path: ../../Main/Infrastructure/Notifications/NotificationScheduler.swift
      - path: ../../Main/Infrastructure/Notifications/NotificationScheduling.swift
      - path: ../../Main/Infrastructure/Notifications/NotificationPermission.swift
      - path: ../../Main/Resources/Localization
      - path: ../../Main/Resources/Audio
      - path: ../../Main/Resources/Generated/Localizations.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.kostyuchenko.fightclock.liveactivity
        PRODUCT_NAME: FightClockLiveActivity
        PRODUCT_MODULE_NAME: LiveActivity
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: LiveActivity/Resources/Configuration/Info.plist
        CODE_SIGN_ENTITLEMENTS: LiveActivity/Resources/Configuration/BoxingTimerLiveActivity.entitlements
        SKIP_INSTALL: true

  MainUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ../../Main/UnitTests
    dependencies:
      - target: Main
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.kostyuchenko.fightclock.unittests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/FightClock.app/FightClock
        BUNDLE_LOADER: $(TEST_HOST)
