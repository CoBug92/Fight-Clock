name: Build and Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      bump_version:
        description: Bump marketing version patch before upload
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: build-and-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    name: Build and upload to TestFlight
    runs-on:
      - self-hosted
      - macOS
      - personal
      - boxing-timer
    timeout-minutes: 60
    env:
      XCODE_PATH: /Applications/Xcode.app
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      CI_KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
      MATCH_READONLY: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          if [ -d "$XCODE_PATH" ]; then
            xcodebuild -version
          else
            echo "Xcode path does not exist: $XCODE_PATH"
            xcode-select -p
            exit 1
          fi

      - name: Install dependencies
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          brew list swiftgen >/dev/null 2>&1 || brew install swiftgen
          brew list swiftlint >/dev/null 2>&1 || brew install swiftlint
          bundle install

      - name: Prepare local project env
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ vars.BUNDLE_ID || 'ru.kostyuchenko.fightclock' }}
        run: |
          if [ -z "$TEAM_ID" ]; then
            echo "Missing required secret APPLE_TEAM_ID"
            exit 1
          fi
          if [ -z "$BUNDLE_ID" ]; then
            echo "Missing required variable BUNDLE_ID"
            exit 1
          fi
          {
            printf '%s\n' 'PROJECT_NAME=BoxingTimer'
            printf '%s\n' 'TARGET_NAME=BoxingTimer'
          } > Scripts/project.env
          printf 'TEAM_ID=%s\n' "$TEAM_ID" >> Scripts/project.env
          printf 'BUNDLE_ID=%s\n' "$BUNDLE_ID" >> Scripts/project.env

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy to TestFlight
        run: |
          cd Scripts/fastlane
          bundle exec fastlane ios deploy_to_tf bump_version:${{ inputs.bump_version || 'false' }}
