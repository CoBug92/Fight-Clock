options:
  bundleIdPrefix: ru.kostyuchenko
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 6.0
    TARGETED_DEVICE_FAMILY: 1
    SUPPORTS_MACCATALYST: false
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    CODE_SIGN_STYLE: Automatic

fileGroups:
  - ../../Resources/Assets
  - ../../Resources/Audio
  - ../../Resources/Configuration
  - ../../Resources/Generated
  - ../../Resources/Localization

targets:
  BoxingTimer:
    type: application
    platform: iOS
    sources:
      - ../../App
      - ../../Core
      - ../../Flows
      - ../../Infrastructure
      - ../../Model
      - path: ../../Resources
        excludes:
          - Generated/Localizations.swift
      - ../../Resources/Generated/Localizations.swift
    dependencies:
      - target: BoxingTimerLiveActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.kostyuchenko.fightclock
        PRODUCT_NAME: FightClock
        PRODUCT_MODULE_NAME: BoxingTimer
        TARGETED_DEVICE_FAMILY: 1
        INFOPLIST_FILE: Resources/Configuration/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Configuration/BoxingTimer.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - BoxingTimerUnitTests

  BoxingTimerLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - ../../LiveActivity
      - path: ../../Model/Domain
      - path: ../../Core/Session
      - path: ../../Infrastructure/Persistence/SharedDefaults.swift
      - path: ../../Infrastructure/Persistence/SessionRepository.swift
      - path: ../../Infrastructure/Persistence/UserDefaultsSessionRepository.swift
      - path: ../../Infrastructure/Notifications/NotificationScheduler.swift
      - path: ../../Infrastructure/Notifications/NotificationScheduling.swift
      - path: ../../Infrastructure/Notifications/NotificationPermission.swift
      - path: ../../Resources/Localization
      - path: ../../Resources/Audio
      - path: ../../Resources/Generated/Localizations.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.kostyuchenko.fightclock.liveactivity
        PRODUCT_NAME: FightClockLiveActivity
        PRODUCT_MODULE_NAME: BoxingTimerLiveActivity
        TARGETED_DEVICE_FAMILY: 1
        INFOPLIST_FILE: LiveActivity/Info.plist
        CODE_SIGN_ENTITLEMENTS: LiveActivity/BoxingTimerLiveActivity.entitlements
        SKIP_INSTALL: true

  BoxingTimerUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ../../UnitTests
    dependencies:
      - target: BoxingTimer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.kostyuchenko.fightclock.unittests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/FightClock.app/FightClock
        BUNDLE_LOADER: $(TEST_HOST)
